name: lint and build

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  lint-build:
    runs-on: ubuntu-latest
    container:
      image: node:20
    steps:
      - uses: actions/checkout@v4
      - run: node --version
      - run: npm ci
      - run: npm run build
      - run: npm run lint
